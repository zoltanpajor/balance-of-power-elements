<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance of Power - Elements | Sandbox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Balance of Power — Elements</h1>
  <p class="subtitle">Created by Wise Platypus</p>
</header>

<button class="layout-toggle" id="layoutToggle" aria-label="Switch layout"></button>

<div class="dice-container" id="diceContainer" title="Click to roll">
  <div class="dice-scene">
    <div class="dice" id="dice">
      <div class="dice-face face-1"><span class="pip"></span></div>
      <div class="dice-face face-2"><span class="pip"></span><span class="pip"></span></div>
      <div class="dice-face face-3"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      <div class="dice-face face-4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      <div class="dice-face face-5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      <div class="dice-face face-6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
    </div>
  </div>
</div>

<div class="app">
  <aside class="palette">
    <h2>Elements</h2>
    <div class="tokens" id="tokenPalette"></div>

    <h2>Board</h2>
    <div class="controls">
      <button id="clearBtn">Clear field elements</button>
    </div>

    <div class="trash" id="trash">🗑 Drop here to remove</div>

    <p class="hint">Drag a field element onto the board to place it. Drag a placed field element to move it. Drag onto the trash — or click a field element — to remove it.</p>
  </aside>

  <main class="board-wrap">
    <div class="board" id="board"></div>
  </main>
</div>

<div class="drag-tooltip" id="dragTooltip"></div>

<footer class="version">v.0.001</footer>

<script src="js/layout.js"></script>
<script src="js/board.js"></script>
<script src="js/dice.js"></script>
</body>
</html>
